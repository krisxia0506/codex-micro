<text x="45" y="1080" font-size="23">每一竖列的 A 焊点串在一起，再接对应的 D 引脚。</text>
<text x="45" y="1120" font-size="20">从背面左到右：D3（SW6/10/13）→ D2 → D1 → D0（SW3/7）。</text>
<text x="45" y="1160" font-size="21">这一张只画 A 侧；B 侧暂时不接，下一张再焊二极管。</text>
<text x="45" y="1201" font-size="19">● 实心圆点才是连接处；不同颜色线交叉不焊在一起，保持绝缘。</text>
<text x="45" y="1234" font-size="17" style="fill:#667789">断电焊接。5V / 3V3 / GND / BAT 均不接按键。图示走线路径需实物检查净空。</text>
