<text x="647" y="555" font-size="19" style="fill:#c54d13">黑环这一头 → D6</text>
<text x="45" y="1080" font-size="23">只用：1 个底座 + 1 个轴 + 1 颗 1N4148 + 两根软线。</text>
<text x="45" y="1120" font-size="21">绿色线：D1 接 A。棕色线：B 接二极管无环端，黑环端接 D6。</text>
<text x="45" y="1160" font-size="21">插上轴并刷入测试程序：按下看 SW1 DOWN，松开看 SW1 UP。</text>
<text x="45" y="1201" font-size="19">● 实心圆点才是连接处；不同颜色线交叉不焊在一起，保持绝缘。</text>
<text x="45" y="1234" font-size="17" style="fill:#667789">断电焊接。5V / 3V3 / GND / BAT 均不接按键。图示走线路径需实物检查净空。</text>
